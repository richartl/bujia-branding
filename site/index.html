<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo · Bujía Project Music</title>
  <link rel="stylesheet" href="catalog.css">
  <script src="catalog-data.js" defer></script>
  <script src="share.js" defer></script>
  <script src="catalog.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap hero">
      <img src="logo.png" width="108" height="49" alt="Bujía">
      <h1>Catálogo<br>de recursos</h1>
    </div>
  </header>
  <main class="wrap">
    <form class="controls" role="search">
      <label>Buscar recurso
        <input type="search" id="search" placeholder="Ej. docerola o código de imagen">
      </label>
    </form>
    <nav id="categories" aria-label="Categorías"></nav>
    <p id="results" role="status"></p>
    <p id="action-status" class="notice" role="status" hidden></p>
    <div id="catalog"></div>
    <noscript>Activa JavaScript para explorar los recursos del catálogo.</noscript>
  </main>
  <template id="card">
    <article class="card">
      <a class="preview"></a>
      <div class="details">
        <div class="meta"><span class="state"></span><span class="version"></span></div>
        <h3><a class="record"></a></h3>
        <p></p>
        <div class="reference-code"><code></code><button class="action" type="button" data-copy-code>Copiar código</button></div>
        <div class="links"><a class="file action" download>Descargar</a><button class="action" type="button" data-share>Compartir</button></div>
      </div>
    </article>
  </template>
</body>
</html>
